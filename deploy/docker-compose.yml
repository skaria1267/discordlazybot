services:
  bot:
    image: ghcr.io/skaria1267/discordlazybot:latest
    container_name: discordlazybot
    restart: unless-stopped
    ports:
      - "127.0.0.1:38761:38761"
    env_file: .env
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
